[project]
name = "ai-job-assistant"
version = "0.1.0"
description = "Local AI career assistant — CV chat, LinkedIn replies, interview prep"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pdfplumber>=0.11",
    "gradio>=4.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipython>=8.0",
]
