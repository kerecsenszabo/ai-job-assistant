[project]
name = "ai-job-assistant"
version = "0.1.0"
description = "Local evidence-first CV generation and job tailoring, with optional CV chat"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langchain==1.4.3",
    "langchain-community==0.4.2",
    "langchain-ollama==1.1.0",
    "chromadb>=0.5",
    "sentence-transformers==6.1.0",
    "pdfplumber>=0.11",
    "gradio==6.29.0",
    "httpx>=0.27",
    "pydantic==2.13.5",
    "rich>=13.0",
    "decorator==5.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipython==9.17.1",
]
