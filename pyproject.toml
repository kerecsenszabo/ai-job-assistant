[project]
name = "ai-job-assistant"
version = "0.1.0"
description = "Local evidence-first CV generation and job tailoring, with optional CV chat"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "langchain-core==1.6.6",
    "langchain-ollama==1.1.0",
    "chromadb==1.5.9",
    "sentence-transformers==6.1.0",
    "pdfplumber==0.11.10",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "rich==15.0.0",
]

[project.scripts]
job-assistant = "assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
